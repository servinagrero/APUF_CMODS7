[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apuf"]

[project]
name = "apuf-cmods7"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "optuna>=4.8.0",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "pypuf>=2.2.0",
    "pyserial>=3.5",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "umap-learn>=0.5.12",
]

[project.scripts]
apuf-run = "apuf.orchestrator:main"

[dependency-groups]
dev = [
    "zensical>=0.0.70",
]
